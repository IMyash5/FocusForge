spring.application.name=focusforge

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:focusforge
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create or update the database schema from JPA entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the terminal
spring.jpa.show-sql=true

# Enable the H2 web console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
